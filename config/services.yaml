# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    redis_url: 'redis://127.0.0.1:6379'
    bist_scan_symbols: 'AEFES,AKBNK,AKSEN,ALARK,ASELS,ASTOR,BIMAS,BRSAN,BTCIM,CANTE,CCOLA,CIMSA,DSTKF,ECILC,EFOR,EKGYO,ENKAI,EREGL,FROTO,GARAN,GLRMK,GUBRF,HALKB,HEKTS,ISCTR,KCHOL,KONTR,KRDMD,KTLEV,KUYAS,MGROS,MIATK,OYAKC,PASEU,PETKM,PGSUS,SAHOL,SASA,SISE,TAVHL,TCELL,THYAO,TOASO,TRALT,TRMET,TTKOM,TUPRS,TURSG,ULKER,VAKBN,YKBNK,AKFGY,AKSA,ALBRK,ARCLK,ASUZU,AYDEM,BAGFS,BERA,BIZIM,BRISA,BUCIM,CEMTS,CLEBI,CRFSA,DEVA,DOAS,DOHOL,EGEEN,ENJSA,ERBOS,GENTS,GESAN,GLYHO,GOZDE,GSDHO,GWIND,HLGYO,IPEKE,ISFIN,ISGYO,ISMEN,JANTS,KARSN,KARTN,KAYSE,KCAER,KMPUR,KORDS,KOZAA,KOZAL,LOGO,MAVI,MEDTR,NTHOL,ODAS,OTKAR,PRKAB,PSGYO,QUAGR,SARKY,SELEC,SKBNK,SMRTG,SNGYO,SOKM,TATGD,TKFEN,TKNSA,TSKB,TTRAK,VAKKO,VESBE,VESTL,YYLAPI,ZOREN'
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    gemini.model: '%env(default:default_gemini_model:GEMINI_MODEL)%'
    default_gemini_model: 'gemini-2.5-flash'
    nvidia.api_key: '%env(default:empty:NVIDIA_API_KEY)%'
    nvidia.model: '%env(default:default_nvidia_model:NVIDIA_MODEL)%'
    default_nvidia_model: 'nvidia/nemotron-3-ultra-550b-a55b:free'
    empty: ''
    active_ai_provider: '%env(default:default_ai_provider:ACTIVE_AI_PROVIDER)%'
    default_ai_provider: 'Gemini'
    telegram.token: '%env(TELEGRAM_BOT_TOKEN)%'
    telegram.chat_id: '%env(TELEGRAM_CHAT_ID)%'
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      
  App\Service\GeminiService:
    arguments:
      $Geminiapikey: '%gemini.api_key%'
      $model: '%gemini.model%'

  App\Service\NvidiaService:
    arguments:
      $NvidiaApiKey: '%nvidia.api_key%'
      $model: '%nvidia.model%'

  App\Factory\AiProviderFactory:
    arguments:
      $activeProvider: '%active_ai_provider%'

  # Alias the interface to the active provider via factory
  App\Interface\AiProviderInterface:
    factory: ['@App\Factory\AiProviderFactory', 'create']

  App\Service\TelegramService:
    arguments:
      $Telegramtoken: '%telegram.token%'
      $Telegramchatid: '%telegram.chat_id%'
      
  App\Service\BistUniverseService:
    arguments:
      $configuredSymbols: '%env(default:bist_scan_symbols:BIST_SCAN_SYMBOLS)%'
