# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    redis_url: 'redis://127.0.0.1:6379'
    bist_scan_symbols: 'AEFES,AKBNK,AKSEN,ALARK,ASELS,ASTOR,BIMAS,BRSAN,BTCIM,CANTE,CCOLA,CIMSA,DSTKF,ECILC,EFOR,EKGYO,ENKAI,EREGL,FROTO,GARAN,GLRMK,GUBRF,HALKB,HEKTS,ISCTR,KCHOL,KONTR,KRDMD,KTLEV,KUYAS,MGROS,MIATK,OYAKC,PASEU,PETKM,PGSUS,SAHOL,SASA,SISE,TAVHL,TCELL,THYAO,TOASO,TRALT,TRMET,TTKOM,TUPRS,TURSG,ULKER,VAKBN,YKBNK'
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    gemini.model: '%env(default:default_gemini_model:GEMINI_MODEL)%'
    default_gemini_model: 'gemini-2.5-flash'
    telegram.token: '%env(TELEGRAM_BOT_TOKEN)%'
    telegram.chat_id: '%env(TELEGRAM_CHAT_ID)%'
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
  App\Service\GeminiService:
    arguments:
      $Geminiapikey: '%gemini.api_key%'
      $model: '%gemini.model%'

  App\Service\TelegramService:
    arguments:
      $Telegramtoken: '%telegram.token%'
      $Telegramchatid: '%telegram.chat_id%'
  App\Service\BistUniverseService:
    arguments:
      $configuredSymbols: '%env(default:bist_scan_symbols:BIST_SCAN_SYMBOLS)%'
  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
